[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awesome-atlas-api"
version = "0.1.0"
description = "Public GitHub Awesome discovery with an independent lake-first runtime"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pyarrow>=18,<24",
    "sentry-sdk>=2.72,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
awesome-api = "awesome_api.cli:main"

[tool.setuptools.packages.find]
include = ["awesome_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
