# CI + security baseline (DevSecOps Phase 1). Public repository: GitHub-hosted runners.
# Railway deploys awesome-web and awesome-api from main only after these checks pass
# ("Wait for CI" on both services).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  awesome-web:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-node.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      working-directory: apps/awesome-web
      node-version: "22"
      build-command: npm run build

  awesome-api:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      working-directory: services/awesome-api
      python-version: "3.12" # matches the python:3.12-slim runtime image
      # Installs from uv.lock (uv sync --frozen --all-extras); mypy runs from [tool.mypy].
      # Ratchet: measured 91.20% on 2026-10-22 (ADR-0004: threshold = measured, rounded down).
      coverage-threshold: "91"
      # requirements.txt (Docker image) must match uv.lock, then pytest under coverage.
      test-command: |
        uv export --frozen --no-dev --no-emit-project --no-hashes --no-header | diff - <(tail -n +4 requirements.txt)
        python -m pytest -q --cov --cov-report=

  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
